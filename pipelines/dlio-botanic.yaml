# -----------------------------------------------------------------------------
# DLIO algorithm parameters, tuned for the BotanicGarden dataset (Velodyne
# VLP-16 + Xsens IMU, ground vehicle).
#
# Starting point is dlio-oxford-spires.yaml's tuning (upstream defaults with
# the Oxford Spires-specific extrinsics/near-field cut removed); no
# BotanicGarden-specific GICP/keyframe retuning has been done yet -- see
# 060_slam_quality_evaluation.md's DLIO multi-dataset section for the
# validation status of this file.
# -----------------------------------------------------------------------------

lidar_sensor_label: "lidar"
imu_sensor_label: "imu"

# base_link is the Xsens IMU (identity) in this dataset's own convention
# (mola_lidar_odometry/scripts/lib/profiles/botanicgarden.sh); DLIO's
# internal reference frame is instead the LiDAR (matching every other
# pipeline in this wrapper), so baselink2lidar stays identity and the IMU
# offset absorbs the Xsens-to-Velodyne lever arm instead. imu_pose_in_lidar_str
# is the inverse of that profile's LIDAR_POSE_* ("0.0584868 0.0084042
# 0.1689155 -1.448155 0.097462 0.444791"), computed via real pose
# composition (mrpt::poses::CPose3D), not derived by hand.
imu_pose_in_lidar_str: "-0.0579683 -0.0111914 -0.1689326 1.4488696 -0.0861871 -0.4471125"
baselink2lidar_pose_str: "0 0 0 0 0 0"

# Velodyne VLP-16, 10 Hz, real per-point timestamps (same situation as Oxford
# Spires' Hesai): this is a fallback only.
fallback_scan_period: 0.1

crop_box_size: ${DLIO_CROPBOX_SIZE|1.0}
blind: 0.0

adaptive: true
pointcloud_deskew: true
pointcloud_voxelize: true
voxel_filter_res: ${DLIO_VOXEL_RES|0.25}

gravity: 9.80665
compute_time_offset: true

imu_calibrate: ${DLIO_IMU_CALIBRATE|true}
imu_approximate_gravity: ${DLIO_IMU_APPROXIMATE_GRAVITY|true}
imu_calibrate_gyro: true
imu_calibrate_accel: true
imu_calib_time_sec: ${DLIO_IMU_CALIB_TIME_SEC|3.0}
imu_buffer_size: 5000

keyframe_thresh_dist: ${DLIO_KEYFRAME_THRESH_D|1.0}
keyframe_thresh_rot: ${DLIO_KEYFRAME_THRESH_R|45.0}

submap_knn: 10
submap_kcv: 10
submap_kcc: 10

gicp_min_num_points: 64
gicp_k_correspondences: 16
gicp_max_corr_dist: ${DLIO_GICP_MAX_CORR_DIST|0.5}
gicp_max_iterations: 32
gicp_transformation_epsilon: 0.01
gicp_rotation_epsilon: 0.01
gicp_init_lambda_factor: 1e-9

geo_Kp: 4.5
geo_Kv: 11.25
geo_Kq: ${DLIO_GEO_KQ|4.0}
geo_Kab: ${DLIO_GEO_KAB|2.25}
geo_Kgb: 1.0
geo_abias_max: 5.0
geo_gbias_max: 0.5

map_sparse_leaf_size: 0.25
wait_until_move: false
dense_map_filtered: false

# --- Visualization ---
show_trajectory: true
show_submap: true
camera_follows_vehicle: true
current_pose_corner_size: 1.0
submap_point_size: 2.0
map_update_decimation: 10

# --- Estimated trajectory output ---
save_trajectory_to_file: ${MOLA_SAVE_TRAJECTORY|false}
trajectory_output_file: ${MOLA_TUM_TRAJECTORY_OUTPUT|'estimated_trajectory.tum'}
