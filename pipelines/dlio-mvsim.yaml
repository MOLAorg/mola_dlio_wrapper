# -----------------------------------------------------------------------------
# DLIO algorithm parameters for MVSim-generated synthetic LiDAR datasets
# (e.g. mvsim-dataset-gen output of mvsim_tutorial/
# demo_lidar_odometry_benchmark.world.xml: Ouster OS1-32 at 10 Hz, 60 m max
# range, mounted 0.75 m above base_link).
#
# Such rawlogs carry no IMU, so run the offline CLI with --synthetic-imu: it
# interleaves a constant-gravity, zero-angular-rate IMU reading before each
# scan, and the motion estimate comes entirely from LiDAR registration. The
# per-point time field is all zeros (instantaneous, undistorted scans), so no
# deskew takes place.
#
# The output trajectory is reported for base_link, to be compared against the
# dataset's base_link ground truth. See dlio-kitti.yaml for the rationale of
# each parameter, which is shared with it.
# -----------------------------------------------------------------------------

lidar_sensor_label: "${MOLA_LIDAR_NAME|lidar1}"
imu_sensor_label: "imu"

imu_pose_in_lidar_str: "0 0 0 0 0 0"
baselink2lidar_pose_str: "${MOLA_BASELINK2LIDAR|0 0 0.75 0 0 0}"

fallback_scan_period: 0.1

crop_box_size: ${DLIO_CROPBOX_SIZE|1.0}
blind: 0.0

adaptive: true
pointcloud_deskew: true
pointcloud_voxelize: true
voxel_filter_res: ${DLIO_VOXEL_RES|0.25}

gravity: 9.80665
compute_time_offset: true

imu_calibrate: ${DLIO_IMU_CALIBRATE|true}
imu_approximate_gravity: ${DLIO_IMU_APPROXIMATE_GRAVITY|true}
imu_calibrate_gyro: true
imu_calibrate_accel: true
imu_calib_time_sec: ${DLIO_IMU_CALIB_TIME_SEC|3.0}
imu_buffer_size: 5000

keyframe_thresh_dist: ${DLIO_KEYFRAME_THRESH_D|1.0}
keyframe_thresh_rot: ${DLIO_KEYFRAME_THRESH_R|45.0}

submap_knn: 10
submap_kcv: 10
submap_kcc: 10

gicp_min_num_points: 64
gicp_k_correspondences: 16
gicp_max_corr_dist: ${DLIO_GICP_MAX_CORR_DIST|1.5}
gicp_max_iterations: 32
gicp_transformation_epsilon: 0.01
gicp_rotation_epsilon: 0.01
gicp_init_lambda_factor: 1e-9

geo_Kp: 4.5
geo_Kv: 11.25
geo_Kq: ${DLIO_GEO_KQ|4.0}
geo_Kab: ${DLIO_GEO_KAB|2.25}
geo_Kgb: 1.0
geo_abias_max: 5.0
geo_gbias_max: 0.5

map_sparse_leaf_size: 0.25
wait_until_move: false
dense_map_filtered: false

show_trajectory: true
show_submap: true
camera_follows_vehicle: true
current_pose_corner_size: 1.0
submap_point_size: 2.0
map_update_decimation: 10

save_trajectory_to_file: ${MOLA_SAVE_TRAJECTORY|false}
trajectory_output_file: ${MOLA_TUM_TRAJECTORY_OUTPUT|'estimated_trajectory.tum'}
