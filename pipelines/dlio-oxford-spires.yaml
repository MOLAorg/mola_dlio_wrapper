# -----------------------------------------------------------------------------
# DLIO algorithm parameters, tuned for the Oxford Spires dataset
# (Hesai Pandar LiDAR + Alphasense IMU, handheld/backpack platform).
#
# There is no upstream Oxford Spires config for DLIO (upstream ships
# Ouster/Livox configs only), so this file starts from upstream's own
# defaults (cfg/dlio.yaml + cfg/params.yaml) and only changes what the
# common plan's Oxford Spires section requires.
# -----------------------------------------------------------------------------

lidar_sensor_label: "lidar"
imu_sensor_label: "imu"

# T_baselink_imu: pose of the IMU frame wrt the LiDAR frame. The Hesai LiDAR
# is already the reference (base_link) frame in this dataset (same value as
# mola_lidar_odometry's and mola_fast_lio2_wrapper's Oxford Spires configs),
# so baselink2lidar below stays identity.
imu_pose_in_lidar_str: "0.018771 -0.008218 -0.070474 -90.6263 -0.1665 -0.1287"
baselink2lidar_pose_str: "0 0 0 0 0 0"

# Fallback only: the Hesai Pandar PointCloud2 in this dataset carries a real
# per-point "timestamp" field (confirmed against the raw bags, same as the
# fastlio2/ellipselio wrappers), so this is unused in practice.
fallback_scan_period: 0.1

# DLIO's own near-field cut (params.yaml: preprocessing.cropBoxFilter.size):
# a symmetric box of *half*-extent this value (side length 2x) centered on
# base_link. See dlio_core/Types.hpp's Config::crop_box_size doc for why the
# upstream default of 1.0 m is kept as-is rather than shrunk to a stricter
# 1 m-radius sphere -- it is the same order of magnitude as the ~1 m
# handheld-carrier cut the sibling wrappers apply via `blind`/`min_range`.
crop_box_size: ${DLIO_CROPBOX_SIZE|1.0}
# Separate to the crop box: `blind` is this *module's* own MRPT-adapter
# point cull (radius, applied before points even reach dlio_core), kept at 0
# here since the crop box above already does the near-field cut DLIO's own
# way; set > 0 to stack an additional cull if ever needed.
blind: 0.0

adaptive: true
pointcloud_deskew: true
pointcloud_voxelize: true
voxel_filter_res: ${DLIO_VOXEL_RES|0.25}

gravity: 9.80665
compute_time_offset: true

# IMU calibration: no Alphasense bias/scale-misalignment calibration is
# available for this rig, so estimate gyro/accel bias and the initial
# gravity-aligned orientation from a startup static window, matching
# upstream's own default strategy.
imu_calibrate: ${DLIO_IMU_CALIBRATE|true}
imu_approximate_gravity: ${DLIO_IMU_APPROXIMATE_GRAVITY|true}
imu_calibrate_gyro: true
imu_calibrate_accel: true
# observatory-quarter-01 starts with the rig held still for several seconds
# before the carrier starts moving (confirmed via the gravity dump, see the
# plan's D9/validation section); upstream's 3 s default is kept.
imu_calib_time_sec: ${DLIO_IMU_CALIB_TIME_SEC|3.0}
imu_buffer_size: 5000

keyframe_thresh_dist: ${DLIO_KEYFRAME_THRESH_D|1.0}
keyframe_thresh_rot: ${DLIO_KEYFRAME_THRESH_R|45.0}

submap_knn: 10
submap_kcv: 10
submap_kcc: 10

gicp_min_num_points: 64
gicp_k_correspondences: 16
gicp_max_corr_dist: ${DLIO_GICP_MAX_CORR_DIST|0.5}
gicp_max_iterations: 32
gicp_transformation_epsilon: 0.01
gicp_rotation_epsilon: 0.01
gicp_init_lambda_factor: 1e-9

# Geometric observer gains: upstream defaults, tuned for a handheld/UAV-ish
# platform already.
geo_Kp: 4.5
geo_Kv: 11.25
geo_Kq: ${DLIO_GEO_KQ|4.0}
geo_Kab: ${DLIO_GEO_KAB|2.25}
geo_Kgb: 1.0
geo_abias_max: 5.0
geo_gbias_max: 0.5

map_sparse_leaf_size: 0.25
wait_until_move: false
dense_map_filtered: false

# --- Visualization ---
show_trajectory: true
show_submap: true
camera_follows_vehicle: true
current_pose_corner_size: 1.0
submap_point_size: 2.0
map_update_decimation: 10
