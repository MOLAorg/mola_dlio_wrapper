# -----------------------------------------------------------------------------
# DLIO algorithm parameters, tuned for the KITTI odometry benchmark.
#
# KITTI's odometry-benchmark sequences carry no IMU stream at all (unlike
# KITTI raw/tracking). mola-dlio-cli's --input-kitti-seq wraps
# KittiOdometryDataset in a decorator that synthesizes a constant-gravity,
# zero-angular-rate CObservationIMU immediately before each real LiDAR scan
# -- enough to keep DLIO's propagation clock ticking and its gravity/bias
# calibration trivially converge to "level, stationary," while the actual
# motion estimate comes entirely from LiDAR-only GICP-to-submap
# registration. See mola-dlio-cli.cpp's KittiWithSyntheticImu for the full
# rationale. This technique is offline-only (see run-single-test.sh's kitti
# arm in run_job_dlio()).
#
# The synthetic IMU carries no real mounting information, so both
# extrinsics below are identity -- there is no physical "IMU frame" to place
# relative to the LiDAR.
# -----------------------------------------------------------------------------

lidar_sensor_label: "lidar"
imu_sensor_label: "imu"

imu_pose_in_lidar_str: "0 0 0 0 0 0"
baselink2lidar_pose_str: "0 0 0 0 0 0"

# KITTI's Velodyne HDL-64E scans carry no real per-point timestamp field
# through this reader, so DLIO always uses the azimuth-based fallback,
# assuming the dataset's documented 10 Hz scan rate.
fallback_scan_period: 0.1

crop_box_size: ${DLIO_CROPBOX_SIZE|1.0}
blind: 0.0

adaptive: true
pointcloud_deskew: true
pointcloud_voxelize: true
voxel_filter_res: ${DLIO_VOXEL_RES|0.25}

gravity: 9.80665
compute_time_offset: true

# No real IMU to calibrate from -- kept enabled anyway (harmless: with a
# constant, zero-noise synthetic input, both bias estimates converge to
# exactly zero and the gravity estimate is exact by construction).
imu_calibrate: ${DLIO_IMU_CALIBRATE|true}
imu_approximate_gravity: ${DLIO_IMU_APPROXIMATE_GRAVITY|true}
imu_calibrate_gyro: true
imu_calibrate_accel: true
imu_calib_time_sec: ${DLIO_IMU_CALIB_TIME_SEC|3.0}
imu_buffer_size: 5000

keyframe_thresh_dist: ${DLIO_KEYFRAME_THRESH_D|1.0}
keyframe_thresh_rot: ${DLIO_KEYFRAME_THRESH_R|45.0}

submap_knn: 10
submap_kcv: 10
submap_kcc: 10

gicp_min_num_points: 64
gicp_k_correspondences: 16
# Larger than the other pipelines' 0.5 m default: with no real IMU-integrated
# motion prior, GICP's initial guess for scan-to-submap alignment is "no
# motion since last scan," and KITTI moves up to ~2 m between consecutive
# 10 Hz scans at speed (unlike every IMU-driven pipeline here, where the
# propagation step already supplies a real motion prior).
gicp_max_corr_dist: ${DLIO_GICP_MAX_CORR_DIST|1.5}
gicp_max_iterations: 32
gicp_transformation_epsilon: 0.01
gicp_rotation_epsilon: 0.01
gicp_init_lambda_factor: 1e-9

geo_Kp: 4.5
geo_Kv: 11.25
geo_Kq: ${DLIO_GEO_KQ|4.0}
geo_Kab: ${DLIO_GEO_KAB|2.25}
geo_Kgb: 1.0
geo_abias_max: 5.0
geo_gbias_max: 0.5

map_sparse_leaf_size: 0.25
wait_until_move: false
dense_map_filtered: false

# --- Visualization ---
show_trajectory: true
show_submap: true
camera_follows_vehicle: true
current_pose_corner_size: 1.0
submap_point_size: 2.0
map_update_decimation: 10

# --- Estimated trajectory output ---
save_trajectory_to_file: ${MOLA_SAVE_TRAJECTORY|false}
trajectory_output_file: ${MOLA_TUM_TRAJECTORY_OUTPUT|'estimated_trajectory.tum'}
